# CWR 2.2 record layout: TER - Territory in Agreement
# Fields transcribed from the official CISAC CWR 2.2 functional spec
# (CWR11-1991R3, section 5.1).
record_type: TER
name: Territory in Agreement
rules:
- id: TER-FLV-01
  reject_level: TR
  field: inclusion_exclusion_indicator
  level: mandatory
  version: '2.0'
  description: Inclusion/Exclusion Indicator must be I or E.
  bmi_exception: ''
  pass:
    inclusion_exclusion_indicator: I
  fail:
    inclusion_exclusion_indicator: X
- id: TER-FLV-02
  reject_level: TR
  field: tis_numeric_code
  level: mandatory
  version: '2.0'
  description: TIS Numeric Code must be a valid CISAC territory.
  bmi_exception: 'BMI: code 0 and 99 (unknown) are standardized to NULL downstream.'
  pass:
    tis_numeric_code: 2136
  fail:
    tis_numeric_code: 9998
- id: TER-RLV-01
  reject_level: TR
  field: null
  level: mandatory
  version: '2.0'
  description: A TER record must follow an AGR record or another TER record.
  implemented: false
  reason: >-
    Structural record-ordering check across the AGR transaction; not
    exercisable via a single TER field patch.
  bmi_exception: ''
fields:
  - key: record_type
    name: Record Type
    start: 1
    length: 3
    type: A
    req: mandatory
    valid_values: ["TER"]
    description: TER = Territory in Agreement.
  - key: transaction_sequence
    name: Transaction Sequence
    start: 4
    length: 8
    type: N
    req: mandatory
    description: Must equal the Transaction Sequence # of the AGR transaction header this record belongs to.
  - key: record_sequence
    name: Record Sequence
    start: 12
    length: 8
    type: N
    req: mandatory
    description: Previous record's Record Sequence # + 1.
  - key: inclusion_exclusion_indicator
    name: Inclusion Exclusion Indicator
    start: 20
    length: 1
    type: L
    req: mandatory
    valid_values_ref: VALID_INCL_EXCL
    description: Whether the territory in this record is within (I) or excluded from (E) the agreement's territorial scope.
  - key: tis_numeric_code
    name: TIS Numeric Code
    start: 21
    length: 4
    type: L
    req: mandatory
    valid_values_ref: VALID_TIS
    description: Numeric identifier of a territory per the CISAC Territory Standard (TIS).
record_length: 24
