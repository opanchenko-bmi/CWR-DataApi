record_type: SPT
name: Publisher Territory of Control
rules:
- id: SPT-FLV-02
  reject_level: TR
  field: interested_party_n
  level: mandatory
  version: '2.0'
  description: 'Interested Party # must be entered and must equal the Interested Party # on the previous
    SPU record.'
  bmi_exception: ''
  pass:
    interested_party_n: AUTO_SPU_IP
  fail:
    interested_party_n: '999999999'
- id: SPT-FLV-06
  reject_level: TR
  field: pr_collection_share
  level: conditional
  version: '2.0'
  description: PR Collection Share must be within 0 - 50.00% (0-5000).
  bmi_exception: ''
  pass:
    pr_collection_share: 5000
  fail:
    pr_collection_share: 12000
- id: SPT-FLV-07
  reject_level: TR
  field: mr_collection_share
  level: conditional
  version: '2.0'
  description: MR Collection Share must be within 0 - 100.00% (0-10000).
  bmi_exception: ''
  pass:
    mr_collection_share: 5000
  fail:
    mr_collection_share: 15000
- id: SPT-FLV-08
  reject_level: TR
  field: sr_collection_share
  level: conditional
  version: '2.0'
  description: SR Collection Share must be within 0 - 100.00% (0-10000).
  bmi_exception: ''
  pass:
    sr_collection_share: 5000
  fail:
    sr_collection_share: 15000
- id: SPT-FLV-09
  reject_level: TR
  field: tis_numeric_code
  level: mandatory
  version: '2.0'
  description: TIS Numeric Code must be a valid CISAC territory.
  bmi_exception: 'BMI: society code 100 (Public Domain) accepted as a supported special case.'
  pass:
    tis_numeric_code: 2136
  fail:
    tis_numeric_code: 9998
- id: SPT-FLV-10
  reject_level: TR
  field: inclusion_exclusion_indicator
  level: mandatory
  version: '2.0'
  description: Inclusion/Exclusion Indicator must be I or E.
  bmi_exception: ''
  pass:
    inclusion_exclusion_indicator: I
  fail:
    inclusion_exclusion_indicator: X
- id: SPT-FLV-11
  reject_level: FR
  field: shares_change
  level: optional
  version: '2.0'
  description: Shares change, if entered, must be Y or N.
  bmi_exception: ''
  pass:
    shares_change: Y
  fail:
    shares_change: Z
- id: SPT-FLV-12
  reject_level: RR
  field: sequence_n
  level: mandatory
  version: '2.1'
  description: 'Sequence # must be present and numeric, starting at 1 for the first SPT after an SPU.'
  bmi_exception: ''
  pass:
    sequence_n: 1
  fail:
    sequence_n: 0
- id: SPT-RLV-01
  reject_level: TR
  field: pr_collection_share
  level: mandatory
  version: '2.0'
  description: If the Inclusion/Exclusion Indicator is I, at least one of PR/MR/SR Collection Share must
    be greater than zero.
  bmi_exception: ''
  pass:
    inclusion_exclusion_indicator: I
    pr_collection_share: 5000
  fail:
    inclusion_exclusion_indicator: I
    pr_collection_share: 0
    mr_collection_share: 0
    sr_collection_share: 0
- id: SPT-FLV-01
  reject_level: TR
  field: record_type
  level: mandatory
  version: '2.0'
  description: An SPT record must follow an SPU, NPN, or another SPT record.
  note: >-
    Already checked generically (validator.py's SPT/OPT/SWT/OWT predecessor
    loop); generated by swapping the NWR header and the first SPT's file
    positions (engine.py's _apply_spt_flv_01) so the SPT lands right after
    GRH instead.
  bmi_exception: ''
- id: SPT-RLV-02
  reject_level: TR
  field: territory_link
  level: mandatory
  version: '2.0'
  description: Each territory (TIS code) included on an SPT/OPT record can only be linked to one SPU/OPU for a given right.
  note: >-
    Scoped per publisher chain (via NWR-TLV-27's position-based
    spt_by_chain), not across the whole file -- two *different* chains
    (e.g. a co-publishing split) legitimately both collecting for the same
    territory is normal. Generated by also marking the chain's Original
    Publisher's own Territory record as Included for World (TIS 2136) with
    a PR Collection Share, duplicating the Administrator's existing claim
    on that same territory/right within the chain.
  bmi_exception: ''
  targets:
    - record_type: SPT
      pass:
        inclusion_exclusion_indicator: E
        pr_collection_share: 0
      fail:
        inclusion_exclusion_indicator: I
        pr_collection_share: 2500
# - id: SPT-RLV-ASCAP-01
#   reject_level: TR
#   field: inclusion_exclusion_indicator
#   level: mandatory
#   version: '2.0'
#   description: 'For registrations to ASCAP only: the first SPT record immediately following an SPU must have the Inclusion/Exclusion Indicator set to I.'
#   implemented: false
#   reason: Society-specific (ASCAP only); this tool doesn't model per-record society interest.
#   bmi_exception: ''
# Field layout below is transcribed from the official CISAC CWR 2.2 spec
# (CWR11-1991R3, section 5.7-5.8 -- SPT/OPT share one record format).
# start/length are 1-based, spec-defined. Record Prefix (1-19) as in NWR.
fields:
  - key: record_type
    name: Record Type
    start: 1
    length: 3
    type: A
    req: mandatory
    valid_values: ["SPT", "OPT"]
    description: SPT (Publisher Territory of Control) or OPT (Publisher Non-Controlled Collection).
  - key: transaction_sequence
    name: Transaction Sequence
    start: 4
    length: 8
    type: N
    req: mandatory
    description: Must equal the Transaction Sequence # of the transaction header this record belongs to.
  - key: record_sequence
    name: Record Sequence
    start: 12
    length: 8
    type: N
    req: mandatory
    description: Previous record's Record Sequence # + 1.
  - key: interested_party
    name: Interested Party
    start: 20
    length: 9
    type: A
    req: mandatory
    description: Submitting publisher's unique identifier for this publisher; must match the preceding SPU/OPU.
  - key: constant
    name: Constant
    start: 29
    length: 6
    type: A
    req: mandatory
    description: Set this field equal to spaces.
  - key: pr_collection_share
    name: PR Collection Share
    start: 35
    length: 5
    type: N
    req: conditional
    description: '% of total royalty for performance collected by this publisher within the territory. Range 0-5000.'
  - key: mr_collection_share
    name: MR Collection Share
    start: 40
    length: 5
    type: N
    req: conditional
    description: '% of total royalty for mechanical uses collected by this publisher. Range 0-10000.'
  - key: sr_collection_share
    name: SR Collection Share
    start: 45
    length: 5
    type: N
    req: conditional
    description: '% of total royalty for synch rights collected by this publisher. Range 0-10000.'
  - key: inclusion_exclusion_indicator
    name: Inclusion Exclusion Indicator
    start: 50
    length: 1
    type: L
    req: mandatory
    valid_values_ref: VALID_INCL_EXCL
    description: Whether the territory in this record is included (I) or excluded (E). Added CWR 2.0.
  - key: tis_numeric_code
    name: TIS Numeric Code
    start: 51
    length: 4
    type: L
    req: mandatory
    valid_values_ref: VALID_TIS
    description: A territory within which this publisher claims collection rights. Added CWR 2.0.
  - key: shares_change
    name: Shares change
    start: 55
    length: 1
    type: B
    req: optional
    valid_values_ref: VALID_YN
    description: Y if the shares change on sub-publication or similar reason. Added CWR 2.0.
  - key: sequence
    name: Sequence
    start: 56
    length: 3
    type: N
    req: mandatory
    since: '2.1'
    description: Sequential number assigned to each territory following an SPU/OPU, starting at 1. Added CWR 2.1.
record_length: 58
