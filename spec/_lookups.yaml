# Custom/allow-list lookups used by cwr_validator.py, and reference data for
# cwr_spec/*.yaml fields' valid_values_ref. Small "verified subset" comments
# from earlier revisions of this file are gone -- most of this is now
# ported from an existing internal C# tool's lookup tables
# (SWV.SWVMessage.Helpers.LookupTables, a similar CWR validation tool), which
# carries the real CISAC/CWR code tables (Society, TIS, Language, Sender,
# Instrument, etc.) rather than small hand-picked samples.
#
# Corrections this port surfaced vs. the previous hand-authored subset here
# (all now reflected below -- also changes cwr_validator.py's live behavior,
# since it loads these lists directly):
#   - VALID_PUBLISHER_TYPE was missing "AQ" (Acquirer) -- cwr_validator.py's
#     own logic already treats AQ as a legitimate publisher type elsewhere
#     (`ptype not in ("E", "AQ")`), so this closes a real gap.
#   - VALID_WRITER_DESIGNATION was missing "PA" (income participant).
#   - VALID_MWDC was missing "UNC" (Unclassified).
#   - VALID_LANGUAGE, VALID_TIS, and VALID_SOCIETY_CODE go from small
#     hand-picked samples (13 / 9 / 2 entries) to the real, much larger
#     CISAC tables (142 / 251 / 331 entries).
#
# Left as-is / not ported:
#   - VALID_TXN_TYPE's C# source (TransactionType) still includes "COP",
#     which the CWR 2.2 spec's own revision history (CWR11-1991R3 p.2) says
#     was removed from the transaction type documentation. Not added here --
#     flagging in case the C# tool intentionally still supports older files.
#   - EDIStandardVersionNumber ({"01.10"}) isn't a lookup here since
#     HDR-FLV-09 / cwr_validator.py already hardcode that single constant.
#   - VALID_YN_BLANK folds together three C# sets that were literally
#     identical ({"Y","N",""}): BlankFlag, FirstRecordingRefusal, and
#     UnknownIndicator (Publisher/Writer Unknown Indicator). Same for
#     VALID_YNU covering RecordedIndicator/ReversionaryIndicator/Validity/
#     ISRCValidity (all {"Y","N","U"}) -- consolidated rather than kept as
#     separate near-duplicate keys.
#
# SOCIETY_NAMES is a {code: name} MAPPING, not a flat list -- cwr_rules.py's
# load_lookups() passes dict-valued entries through unchanged (only
# list-valued entries become sets). VALID_SENDER_FILE_CODE is the short
# 2-3 char sender code used in the CWR file NAMING convention
# (CWyynnnnsss_rrr.Vxx, spec section 3.1) -- distinct from HDR's numeric
# Sender ID field (the submitter's IPI#).

