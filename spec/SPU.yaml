record_type: SPU
name: Publisher Controlled By Submitter
rules:
- id: SPU-FLV-01
  reject_level: TR
  field: publisher_sequence_n
  level: mandatory
  version: '2.0'
  description: 'Publisher Sequence # must be entered and numeric.'
  bmi_exception: ''
  pass:
    publisher_sequence_n: 1
  fail:
    publisher_sequence_n: 0
- id: SPU-FLV-02
  reject_level: TR
  field: interested_party_n
  level: mandatory
  version: '2.0'
  description: 'Interested Party # must be entered for record type SPU.'
  bmi_exception: ''
  pass:
    interested_party_n: 001819067
  fail:
    interested_party_n: ''
- id: SPU-FLV-04
  reject_level: TR
  field: publisher_name
  level: mandatory
  version: '2.0'
  description: Publisher Name must be present.
  bmi_exception: ''
  pass:
    publisher_name: SONY MUSIC PUBLISHING
  fail:
    publisher_name: ''
- id: SPU-FLV-06
  reject_level: TR
  field: publisher_type
  level: mandatory
  version: '2.0'
  description: Publisher Type must be a valid code (E/AM/PA/SE/ES).
  bmi_exception: ''
  pass:
    publisher_type: E
  fail:
    publisher_type: ZZ
- id: SPU-FLV-13
  reject_level: TR
  field: pr_ownership_share
  level: conditional
  version: '2.0'
  description: PR Ownership Share must be numeric, within 0 - 50.00% (0-5000).
  bmi_exception: ''
  pass:
    pr_ownership_share: 5000
  fail:
    pr_ownership_share: 15000
- id: SPU-FLV-16
  reject_level: TR
  field: mr_ownership_share
  level: conditional
  version: '2.0'
  description: MR Ownership Share must be numeric, within 0 - 100.00% (0-10000).
  bmi_exception: ''
  pass:
    mr_ownership_share: 5000
  fail:
    mr_ownership_share: 15000
- id: SPU-FLV-18
  reject_level: TR
  field: sr_ownership_share
  level: conditional
  version: '2.0'
  description: SR Ownership Share must be numeric, within 0 - 100.00% (0-10000).
  bmi_exception: ''
  pass:
    sr_ownership_share: 5000
  fail:
    sr_ownership_share: 15000
- id: SPU-FLV-21
  reject_level: FR
  field: first_recording_refusal_ind
  level: optional
  version: '2.0'
  description: First Recording Refusal Ind, if entered, must be equal to Y or N.
  bmi_exception: ''
  pass:
    first_recording_refusal_ind: Y
  fail:
    first_recording_refusal_ind: Z
- id: SPU-FLV-30
  reject_level: FR
  field: agreement_type
  level: optional
  version: '2.1'
  description: Agreement Type, if entered, must match an entry in the Agreement Type table (e.g. OS/PS/OG/PG).
  bmi_exception: ''
  pass:
    agreement_type: OS
  fail:
    agreement_type: ZZ
- id: SPU-FLV-37
  reject_level: TR
  field: publisher_name
  level: mandatory
  version: '2.0'
  description: Publisher Name must contain only valid ASCII characters.
  bmi_exception: ''
  pass:
    publisher_name: SONY MUSIC PUBLISHING
  fail:
    publisher_name: SÖNY MúSIC
- id: SPU-FLV-40
  reject_level: TR
  field: publisher_ipi_name_n
  level: conditional
  version: '2.0'
  description: If SPU is the collecting publisher, Publisher IPI Name Number must be entered.
  bmi_exception: 'BMI: SPU collecting publisher may omit IPI Name Number; do not fail this rule for that
    specific case.'
  pass:
    publisher_ipi_name_n: 260179860
  fail:
    publisher_ipi_name_n: 0
- id: SPU-RLV-03
  reject_level: TR
  field: pr_ownership_share
  level: mandatory
  version: '2.0'
  description: Ownership shares must be zero if Publisher Type is not E (Original Publisher) or AQ (Acquirer).
  bmi_exception: ''
  pass:
    publisher_type: AM
    pr_ownership_share: 0
  fail:
    publisher_type: AM
    pr_ownership_share: 5000
- id: SPU-RLV-03B
  reject_level: TR
  field: mr_ownership_share
  level: mandatory
  version: '2.0'
  description: MR Ownership Share must be zero if Publisher Type is not E or AQ.
  bmi_exception: ''
  pass:
    publisher_type: AM
    mr_ownership_share: 0
  fail:
    publisher_type: AM
    mr_ownership_share: 5000
- id: SPU-RLV-03C
  reject_level: TR
  field: sr_ownership_share
  level: mandatory
  version: '2.0'
  description: SR Ownership Share must be zero if Publisher Type is not E or AQ.
  bmi_exception: ''
  pass:
    publisher_type: AM
    sr_ownership_share: 0
  fail:
    publisher_type: AM
    sr_ownership_share: 5000
- id: SPU-RLV-08
  reject_level: TR
  field: pr_ownership_share
  level: mandatory
  version: '2.0'
  description: If the record represents an Acquirer (AQ), at least one of PR/MR/SR Ownership Share must
    be greater than zero.
  bmi_exception: ''
  pass:
    publisher_type: AQ
    pr_ownership_share: 5000
  fail:
    publisher_type: AQ
    pr_ownership_share: 0
    mr_ownership_share: 0
    sr_ownership_share: 0
- id: SPU-FLV-05
  reject_level: TR
  field: publisher_unknown_indicator
  level: mandatory
  version: '2.0'
  description: Publisher Unknown Indicator must be blank for SPU records.
  bmi_exception: ''
  pass:
    publisher_unknown_indicator: ''
  fail:
    publisher_unknown_indicator: 'Y'
- id: SPU-FLV-11
  reject_level: FR
  field: pr_affiliation_society
  level: optional
  version: '2.0'
  description: PR Affiliation Society #, if entered, must match an entry in the Society Code table.
  bmi_exception: ''
  pass:
    pr_affiliation_society: '021'
  fail:
    pr_affiliation_society: '999'
- id: SPU-FLV-15
  reject_level: FR
  field: mr_affiliation_society
  level: optional
  version: '2.0'
  description: MR Affiliation Society, if entered, must match an entry in the Society Code table.
  bmi_exception: ''
  pass:
    mr_affiliation_society: '021'
  fail:
    mr_affiliation_society: '999'
- id: SPU-FLV-17
  reject_level: FR
  field: sr_affiliation_society
  level: optional
  version: '2.0'
  description: SR Society, if entered, must match an entry in the Society Code table.
  bmi_exception: ''
  pass:
    sr_affiliation_society: '021'
  fail:
    sr_affiliation_society: '999'
- id: SPU-FLV-20
  reject_level: FR
  field: special_agreements_indicator
  level: optional
  version: '2.0'
  description: Special Agreements Indicator, if entered, must match an entry in the Special Agreement
    Indicator table.
  bmi_exception: ''
  pass:
    special_agreements_indicator: R
  fail:
    special_agreements_indicator: Z
- id: SPU-FLV-23
  reject_level: FR
  field: tax_id
  level: optional
  version: '1.1'
  description: 'Tax ID #, if entered, must be numeric.'
  bmi_exception: ''
  pass:
    tax_id: '123456789'
  fail:
    tax_id: 12A45B789
- id: SPU-FLV-29
  reject_level: TR
  field: publisher_name
  level: mandatory
  version: '2.0'
  description: If Publisher Name matches a Society Code table entry, Publisher IPI Name # must be entered.
  bmi_exception: ''
  pass:
    publisher_name: SONY MUSIC PUBLISHING
    publisher_ipi_name_n: 260179860
  fail:
    publisher_name: BMI
    publisher_ipi_name_n: 0
- id: SPU-FLV-31
  reject_level: FR
  field: usa_license_ind
  level: optional
  version: '2.1'
  description: USA License Ind, if entered, must match an entry in the USA License Indicator table.
  bmi_exception: ''
  pass:
    usa_license_ind: A
  fail:
    usa_license_ind: Z
- id: SPU-RLV-02
  reject_level: TR
  field: publisher_chain_first
  level: mandatory
  version: '2.0'
  description: The first SPU record within a chain must be for an Original Publisher or Income Participant (Publisher Type E or PA).
  note: >-
    Checked by finding, per Publisher Sequence #, the first-positioned SPU
    and requiring it be E/PA; generated by retyping the chain's actual
    Original Publisher to AM (its shares zeroed too, so it doesn't
    collaterally trip SPU-RLV-03's "non-E/AQ must be zero" check -- the
    resulting "chain has no E/AQ" is a real, expected NWR-TLV-25 collateral).
  bmi_exception: ''
  targets:
    - record_type: SPU
      pass:
        publisher_type: E
      fail:
        publisher_type: AM
        pr_ownership_share: 0
        mr_ownership_share: 0
        sr_ownership_share: 0
- id: SPU-RLV-04
  reject_level: TR
  field: null
  level: mandatory
  version: '2.0'
  description: If Publisher Type is AM, the publisher must have the right to administer for the preceding publisher.
  implemented: false
  reason: >-
    No agreements/authority database is modeled -- there is no real data
    this tool has to check "the right to administer" against, so this can't
    be exercised without fabricating a fake authority record with no basis
    in an actual CWR file.
  bmi_exception: ''
- id: SPU-RLV-05
  reject_level: TR
  field: publisher_chain_sequence
  level: mandatory
  version: '2.0'
  description: Administrators and sub-publishers must be assigned the same Publisher Sequence # as the original publisher/income participant they administer for.
  note: >-
    Tracked by file position (the most recently seen chain leader), not by
    grouping on the Publisher Sequence # field itself, since that field is
    the very thing being validated; generated by giving the first chain's
    Administrator (AM) a different Publisher Sequence # (2, chain 2's)
    while it stays positioned in chain 1. This incidentally makes chain 2's
    own grouping briefly include this mislabeled AM ahead of its real
    Original Publisher for SPU-RLV-02's "first SPU must be E/PA" check, and
    reassigns the AM's own SPT records to chain 2's NWR-TLV-27 territory
    totals instead of chain 1's -- both are accurate collateral findings
    (the mislabeled record and its SPTs really do now belong to chain 2's
    bookkeeping), not bugs.
  bmi_exception: ''
  targets:
    - record_type: SPU
      match:
        publisher_type: AM
      pass:
        publisher_sequence_n: 1
      fail:
        publisher_sequence_n: 2
# - id: SPU-RLV-06
#   reject_level: TR
#   field: null
#   level: mandatory
#   version: '2.0'
#   description: Only OPU records may appear in a publisher chain begun with an OPU.
#   implemented: false
#   reason: Publisher-chain structure; not exercisable via a single-record patch.
#   bmi_exception: ''
- id: SPU-RLV-07
  reject_level: RR
  field: publisher_chain_opu_spt
  level: mandatory
  version: '2.0'
  description: Territory records (SPT) are not valid in a publisher chain beginning with an OPU.
  note: >-
    The baseline has no OPU-led chain to patch -- engine.py's
    _apply_spu_rlv_07 clones the controlled (E) SPU as an OPU under a fresh
    Publisher Sequence # (so it starts its own chain rather than joining an
    existing one) and clones an existing SPT to physically follow it.
  bmi_exception: ''
- id: SPU-RLV-09
  reject_level: TR
  field: publisher_chain_acquirer_order
  level: mandatory
  version: '2.1'
  description: If the role code is AQ (Acquirer), this SPU record must follow an SPU record with a role code of E.
  note: >-
    Retyping the SPU immediately after the chain's Administrator (its
    predecessor is AM, not E) to AQ, with a small nonzero share (1) so it
    doesn't also trip the pre-existing "AQ must not be all zero" check --
    retyping the Administrator itself (which *does* immediately follow E)
    would be compliant instead of a violation.
  bmi_exception: ''
  targets:
    - record_type: SPU
      match:
        publisher_type: SE
      pass:
        publisher_type: SE
      fail:
        publisher_type: AQ
        pr_ownership_share: 1
- id: SPU-RLV-ASCAP-01
  reject_level: TR
  field: null
  level: mandatory
  version: '2.1'
  description: 'For registrations to ASCAP only: where there is an ASCAP Original publisher, there must be a collection territory that includes the United States within that chain of title.'
  implemented: false
  reason: Society-specific (ASCAP only); publisher-chain structure not exercisable via a single-record patch.
  bmi_exception: ''
- id: SPU-RLV-SGAE-01
  reject_level: TR
  field: null
  level: mandatory
  version: '2.1'
  description: 'For registrations to SGAE only: SPU records for final Sub-Publishers with SGAE interest must include a pre-notified Society-assigned Agreement number unless Agreement Type is OS or PS.'
  implemented: false
  reason: Society-specific (SGAE only); no agreements database is modeled.
  bmi_exception: ''
- id: SPU-RLV-SGAE-02
  reject_level: TR
  field: agreement_type
  level: mandatory
  version: '2.1'
  description: 'For registrations to SGAE only: if the record is of SGAE interest, an Agreement Type must be entered.'
  implemented: false
  reason: Society-specific (SGAE only); this tool doesn't model per-record society interest.
  bmi_exception: ''
- id: SPU-RLV-MUSICMARK-01
  reject_level: TR
  field: null
  level: mandatory
  version: '2.1'
  description: 'For registrations to MusicMark societies only: if the original publisher belongs to ASCAP, the sub-publisher/administrator in the chain for the US cannot belong to BMI or SESAC (and vice versa for BMI/SESAC originals).'
  implemented: false
  reason: Society-specific (MusicMark); publisher-chain structure across multiple SPU records not exercisable via a single-record patch.
  bmi_exception: ''
- id: SPU-FLV-41
  reject_level: TR
  field: interested_party_n
  level: mandatory
  version: '2.0'
  description: Submitters must ensure the Interested Party # is unique within their system for both current and past controlled parties.
  implemented: false
  reason: Cross-file uniqueness is not verified by this tool.
  bmi_exception: ''
- id: SPU-FLV-42
  reject_level: TR
  field: publisher_ipi_name_n
  level: optional
  version: '2.0'
  description: If Publisher IPI Name # is entered, it must match a publisher entry in the IPI database.
  implemented: false
  reason: No IPI database is modeled in this project's lookups.
  bmi_exception: ''
- id: SPU-FLV-43
  reject_level: TR
  field: submitter_agreement_number
  level: optional
  version: '2.0'
  description: If Submitter Agreement Number is entered, it must match the identifier for an agreement on file with the society of the acquiring party, or an identifier in the AGR transaction.
  implemented: false
  reason: No agreements database is modeled, and cross-transaction matching to an AGR record isn't exercisable via a single-record patch.
  bmi_exception: ''
- id: SPU-FLV-44
  reject_level: TR
  field: publisher_ipi_base_number
  level: optional
  version: '2.0'
  description: If Publisher IPI Base Number is entered, it must match an entry in the IPI database.
  implemented: false
  reason: No IPI database is modeled, and this field isn't mapped in layout.py's REAL_LAYOUT.
  bmi_exception: ''
- id: SPU-FLV-45
  reject_level: TR
  field: international_standard_agreement_code
  level: optional
  version: '2.0'
  description: If International Standard Agreement Code is entered, it must match an entry in the international agreements database.
  implemented: false
  reason: No ISAC database is modeled, and this field isn't mapped in layout.py's REAL_LAYOUT.
  bmi_exception: ''
- id: SPU-FLV-46
  reject_level: TR
  field: society_assigned_agreement_number
  level: optional
  version: '2.0'
  description: If Society-Assigned Agreement Number is entered, it must match the identifier for an agreement on file with the society of the acquiring publisher.
  implemented: false
  reason: No agreements database is modeled, and this field isn't mapped in layout.py's REAL_LAYOUT.
  bmi_exception: ''
- id: SPU-FLV-GEMA-01
  reject_level: TR
  field: submitter_agreement_number
  level: conditional
  version: '2.0'
  description: 'For registrations to GEMA only: if Agreement Type is PS, the Submitter Agreement Number must be entered and must match an entry in a corresponding AGR record.'
  implemented: false
  reason: Society-specific (GEMA only); no agreements database is modeled.
  bmi_exception: ''
- id: SPU-FLV-GEMA-02
  reject_level: TR
  field: agreement_type
  level: conditional
  version: '2.1'
  description: 'For registrations to GEMA only: if Publisher Type is SE, an Agreement Type must be entered.'
  implemented: false
  reason: Society-specific (GEMA only); this tool doesn't model per-record society interest.
  bmi_exception: ''
- id: SPU-FLV-SACEM-01
  reject_level: TR
  field: agreement_type
  level: conditional
  version: '2.1'
  description: 'For registrations to SACEM only: if Publisher Type is SE, an Agreement Type must be entered, and final Sub-Publishers in France must supply a pre-notified Society-assigned Agreement Number.'
  implemented: false
  reason: Society-specific (SACEM only); no agreements database is modeled.
  bmi_exception: ''
- id: SPU-FLV-SACEM-02
  reject_level: TR
  field: publisher_ipi_name_n
  level: conditional
  version: '2.2'
  description: >-
    For registrations to SACEM only: the IPI Name # on the Original
    Publisher SPU must equal the assignor IPI Name # for the agreement
    represented by the first 7 characters of the Society Provided
    Agreement Number, and the IPI Name # on the Sub-Publisher SPU must
    equal the assignee IPI Name # represented by the last 7 characters.
  implemented: false
  reason: Society-specific (SACEM only); no agreements database is modeled.
  bmi_exception: ''
- id: SPU-FLV-SAAN-01
  reject_level: TR
  field: society_assigned_agreement_number
  level: conditional
  version: '2.0'
  description: >-
    For registrations to societies requiring Society Assigned Agreement
    Numbers only: a Society Assigned Agreement Number must be provided on
    SPU, must not represent a terminated agreement, must exist in the
    Society system, and its claimed territory must be included in the
    agreement on file at the Society.
  implemented: false
  reason: >-
    Society-specific and requires a live agreements database; this field
    also isn't mapped in layout.py's REAL_LAYOUT.
  bmi_exception: ''
- id: SPU-FLV-ICE-01
  reject_level: TR
  field: society_assigned_agreement_number
  level: conditional
  version: '2.0'
  description: 'For registrations to ICE Societies only: the Society Assigned Agreement Number must refer to the quoted combination of Submitter, Assignor, and Agreement number on the SPU transaction.'
  implemented: false
  reason: Society-specific (ICE only); no agreements database is modeled.
  bmi_exception: ''
# Field layout below is transcribed from the official CISAC CWR 2.2 spec
# (CWR11-1991R3, section 5.4-5.5 -- SPU/OPU share one record format).
# start/length are 1-based, spec-defined. Record Prefix (1-19) as in NWR.
fields:
  - name: Record Type
    start: 1
    length: 3
    type: A
    req: mandatory
    valid_values: ["SPU", "OPU"]
    description: SPU (Publisher Controlled By Submitter) or OPU (Other Publisher).
  - name: Transaction Sequence #
    start: 4
    length: 8
    type: N
    req: mandatory
    description: Must equal the Transaction Sequence # of the transaction header this record belongs to.
  - name: Record Sequence #
    start: 12
    length: 8
    type: N
    req: mandatory
    description: Previous record's Record Sequence # + 1.
  - name: Publisher Sequence #
    start: 20
    length: 2
    type: N
    req: mandatory
    description: >-
      A sequential number assigned to the original publishers on this work;
      the first chain is 1, each subsequent chain increments by 1.
  - name: Interested Party #
    start: 22
    length: 9
    type: A
    req: conditional
    description: Submitting publisher's unique identifier for this publisher. Required for SPU, optional for OPU.
  - name: Publisher Name
    start: 31
    length: 45
    type: A
    req: conditional
    description: The name of this publishing company. Required for SPU, optional for OPU.
  - name: Publisher Unknown Indicator
    start: 76
    length: 1
    type: F
    req: conditional
    description: >-
      Must be blank for SPU. For OPU, must be Y if Publisher Name is blank,
      else Y/N.
  - name: Publisher Type
    start: 77
    length: 2
    type: L
    req: conditional
    valid_values_ref: VALID_PUBLISHER_TYPE
    description: Code defining this publisher's role. Required for SPU, optional for OPU.
  - name: Tax ID #
    start: 79
    length: 9
    type: A
    req: optional
    description: The number used to identify this publisher for domestic tax reporting.
  - name: Publisher IPI Name #
    start: 88
    length: 11
    type: L
    req: conditional
    description: >-
      Mandatory if this SPU is followed by an SPT (i.e. represents the file
      submitter, the collecting publisher).
  - name: Submitter Agreement Number
    start: 99
    length: 14
    type: A
    req: optional
    description: The agreement number, unique to the submitter, under which this publisher acquired rights.
  - name: PR Affiliation Society #
    start: 113
    length: 3
    type: L
    req: conditional
    description: Performing Rights Society this publisher is affiliated with.
  - name: PR Ownership Share
    start: 116
    length: 5
    type: N
    req: conditional
    description: Publisher's ownership % of performance rights. Range 0-5000 (0-50.00%), implied decimal.
  - name: MR Society
    start: 121
    length: 3
    type: L
    req: conditional
    description: Mechanical Rights Society this publisher is affiliated with.
  - name: MR Ownership Share
    start: 124
    length: 5
    type: N
    req: conditional
    description: Publisher's ownership % of mechanical rights. Range 0-10000 (0-100.00%), implied decimal.
  - name: SR Society
    start: 129
    length: 3
    type: L
    req: conditional
    description: Society this publisher is affiliated with for synchronization rights.
  - name: SR Ownership Share
    start: 132
    length: 5
    type: N
    req: conditional
    description: Publisher's ownership % of synch rights. Range 0-10000 (0-100.00%), implied decimal.
  - name: Special Agreements Indicator
    start: 137
    length: 1
    type: L
    req: optional
    description: Indicates publisher claiming reversionary rights (societies that recognize them, e.g. SOCAN).
  - name: First Recording Refusal Ind
    start: 138
    length: 1
    type: F
    req: optional
    valid_values_ref: VALID_YN
    description: >-
      Whether the submitter has refused authority for the first recording.
      Mandatory for UK society registrations.
  - name: Filler
    start: 139
    length: 1
    type: A
    req: optional
    description: Fill with a blank.
  - name: Publisher IPI Base Number
    start: 140
    length: 13
    type: L
    req: optional
    description: The IPI base number assigned to this publisher. Added CWR 2.0.
  - name: International Standard Agreement Code
    start: 153
    length: 14
    type: A
    req: optional
    description: The ISAC assigned to the agreement under which this publisher share is administered. Added CWR 2.0.
  - name: Society-assigned Agreement Number
    start: 167
    length: 14
    type: A
    req: optional
    description: The agreement number assigned by the society of the sub-publisher. Added CWR 2.0.
  - name: Agreement Type
    start: 181
    length: 2
    type: L
    req: optional
    since: '2.1'
    valid_values_ref: VALID_AGREEMENT_TYPE
    description: Code defining the category of agreement. Added CWR 2.1.
  - name: USA License Ind
    start: 183
    length: 1
    type: L
    req: optional
    since: '2.1'
    description: Indicates rights flow through SESAC/BMI/ASCAP/AMRA in the US. Added CWR 2.1.
record_length: 183
