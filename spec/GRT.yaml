# CWR 2.2 record layout: GRT - Group Trailer
# Positions are 1-based and inclusive. Fields must be contiguous and gapless.
record_type: GRT
name: Group Trailer
rules:
- id: GRT-FLV-01
  reject_level: GR
  field: group_id
  level: mandatory
  version: '2.0'
  description: Group ID must be equal to the Group ID presented on the preceding GRH record.
  bmi_exception: ''
  pass:
    group_id: AUTO_GROUP_ID
  fail:
    group_id: 99
- id: GRT-FLV-02
  reject_level: GR
  field: transaction_count
  level: mandatory
  version: '2.0'
  description: Transaction Count must equal the actual number of transactions within this group.
  bmi_exception: ''
  pass:
    transaction_count: AUTO_TXN_COUNT
  fail:
    transaction_count: 99
- id: GRT-FLV-03
  reject_level: GR
  field: record_count
  level: mandatory
  version: '2.0'
  description: Record Count must equal the actual number of physical records in this group, including
    GRH and GRT.
  bmi_exception: ''
  pass:
    record_count: AUTO_GROUP_RECORD_COUNT
  fail:
    record_count: 1
- id: GRT-FLV-04
  reject_level: GR
  field: null
  level: conditional
  version: '2.0'
  description: Currency Indicator is mandatory if Total Monetary Value is provided.
  implemented: false
  reason: >-
    The spec itself notes Currency Indicator and Total Monetary Value are
    ignored for CWR transactions -- this tool doesn't populate or check
    either field, kept here only for traceability against the numbered
    spec item.
  bmi_exception: ''
# Field layout below is transcribed from the official CISAC CWR 2.2 spec
# (CWR11-1991R3, section 3.7). start/length are 1-based, spec-defined.
fields:
  - key: record_type
    name: Record Type
    start: 1
    length: 3
    type: A
    req: mandatory
    valid_values: ["GRT"]
    description: GRT = Group Trailer
  - key: group_id
    name: Group ID
    start: 4
    length: 5
    type: N
    req: mandatory
    description: The same group id that was present on the preceding GRH record.
  - key: transaction_count
    name: Transaction Count
    start: 9
    length: 8
    type: N
    req: mandatory
    description: The number of transactions included within this group.
  - key: record_count
    name: Record Count
    start: 17
    length: 8
    type: N
    req: mandatory
    description: >-
      The number of physical records included within this group, including
      GRH and GRT records.
  - key: currency_indicator
    name: Currency indicator
    start: 25
    length: 3
    type: L
    req: conditional
    description: >-
      ISO code of the currency used for the total monetary value (Version
      1.10 field). Note: ignored for CWR -- mandatory only if Total Monetary
      Value is provided, but the spec explicitly says both fields are
      ignored for CWR transactions.
  - key: total_monetary_value
    name: Total monetary value
    start: 28
    length: 10
    type: N
    req: optional
    description: >-
      Total monetary value represented by the group (Version 1.10 field).
      Note: ignored for CWR.
record_length: 37
