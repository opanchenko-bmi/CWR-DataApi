#   implemented: false
#   reason: Society-specific (SACEM only); no ISWC-block registration database is modeled.
#   bmi_exception: ''
- id: NWR-TLV-01
  reject_level: TR
  field: transaction_count
  level: mandatory
  version: '2.0'
  description: Only one NWR/REV/ISW/EXC transaction is allowed per transaction.
  note: >-
    Cross-transaction structural check; engine.py's _apply_nwr_tlv_01
    clones the NWR header as a bare second transaction (no children of its
    own, to avoid double-counting shares in every other TLV aggregate
    check) appended right before GRT.
  bmi_exception: ''
# - id: NWR-TLV-02
#   reject_level: FR
#   field: null
#   level: mandatory
#   version: '2.0'
#   description: If Record Type is REV and the work hasn't been successfully registered with the receiving society, the record type is changed to NWR.
#   implemented: false
#   reason: Requires cross-file registration history this tool doesn't track.
#   bmi_exception: ''
- id: NWR-TLV-04
  reject_level: TR
  field: pr_ownership_share
  level: mandatory
  version: '2.0'
  description: >-
    Total Ownership shares across all SPU and OPU records must be <= 50%
    for PR Shares and <= 100% for MR/SR Shares (tolerance .06%). Total
    Writer Ownership shares across all SWR/OWR must be 0% or >= 50% for PR,
    <= 100% for MR/SR.
  note: >-
    Checked by validator.py as a cross-record aggregate across all
    SPU/OPU/SWR/OWR children (finding attributed to NWR); generated by
    patching the first SPU's own PR Ownership Share (still individually
    valid at 50.00%) high enough to push the file-wide total over the
    threshold regardless of the other SPUs' shares.
  bmi_exception: ''
  targets:
    - record_type: SPU
      pass:
        pr_ownership_share: 2500
      fail:
        pr_ownership_share: 5000
- id: NWR-TLV-07
  reject_level: TR
  field: spu_collection
  level: mandatory
  version: '2.0'
  description: For each publisher controlled by the submitter that has collection shares, there must be at least one SPT record.
  note: >-
    Checked in validator.py by comparing SPU vs. SPT Interested Party #s;
    generated by redirecting the baseline's first SPT (belonging to the
    first SPU) onto a second, already-SPT-covered SPU's IP (AUTO_SPU_IP_2)
    -- the first SPU ends up with no matching SPT, without leaving any SPT
    pointing at a nonexistent IP.
  bmi_exception: ''
  targets:
    - record_type: SPT
      pass:
        interested_party_n: AUTO_SPU_IP
      fail:
        interested_party_n: AUTO_SPU_IP_2
- id: NWR-TLV-08
  reject_level: RR
  field: null
  level: mandatory
  version: '2.0'
  description: Detail records other than those listed in the Transaction Format table may not be submitted for this transaction.
  implemented: false
  reason: Whole-transaction structural check; not exercisable via a single-field patch.
  bmi_exception: ''
- id: NWR-TLV-10
  reject_level: TR
  field: version_type
  level: mandatory
  version: '2.0'
  description: If Version Type is MOD, at least one SWR or OWR record must have a Writer Designation Code of AR/AD/SR/SA/TR.
  note: >-
    Checked by validator.py as a cross-record check across all SWR/OWR
    children (finding attributed to NWR's version_type field). FAIL is
    clean (MOD + arrangement/adaptation filled in + the one SWR left at a
    non-arranger code). PASS is a known partial: giving the baseline's only
    SWR an arranger code satisfies this rule but then trips NWR-TLV-12
    (needs a separate CA/A/C writer) -- a true clean PASS needs a second
    SWR/OWR record, which this tool can't synthesize yet.
  bmi_exception: ''
  targets:
    - record_type: NWR
      pass:
        version_type: MOD
        music_arrangement: ARR
        lyric_adaptation: NEW
      fail:
        version_type: MOD
        music_arrangement: ARR
        lyric_adaptation: NEW
    - record_type: SWR
      pass:
        writer_designation_code: AR
      fail:
        writer_designation_code: CA
- id: NWR-TLV-12
  reject_level: TR
  field: record_type
  level: mandatory
  version: '2.0'
  description: A transaction must contain at least one writer record (SWR or OWR) with a Writer Designation Code of CA, A, or C.
  note: >-
    Checked by validator.py as a cross-record check across all SWR/OWR
    children (finding attributed to NWR's record_type field); generated by
    patching the baseline's one SWR's Writer Designation Code to PA (valid,
    but outside CA/A/C and outside the arranger set too, so it doesn't
    collaterally trip NWR-TLV-23/NWR-FLV-BMI-01-style checks).
  bmi_exception: ''
  targets:
    - record_type: SWR
      pass:
        writer_designation_code: CA
      fail:
        writer_designation_code: PA
- id: NWR-TLV-13
  reject_level: TR
  field: null
  level: mandatory
  version: '2.0'
  description: If Record Type is NWR, the work cannot previously have been sent and accepted on a CWR transaction.
  implemented: false
  reason: Requires cross-file registration history this tool doesn't track.
  bmi_exception: ''
- id: NWR-TLV-14
  reject_level: TR
  field: mr_collection_share
  level: mandatory
  version: '2.0'
  description: The total of collection shares cannot exceed 100% for a given right for a territory (tolerance .06%).
  note: >-
    Checked by validator.py as a cross-record aggregate across all
    SPT/OPT/SWT/OWT children (finding attributed to NWR); generated by
    raising the first chain's World-territory (Administrator) SPT's MR
    Collection Share to 100% -- still individually valid on its own -- so
    it alone pushes that territory's combined MR total (with the second
    chain's own contribution) over the limit. PR/SR use a 50%/100%
    individual cap respectively that two chains can't cross without
    exceeding it per-record first, which is why MR was chosen here.
  bmi_exception: ''
  targets:
    - record_type: SPT
      match:
        inclusion_exclusion_indicator: I
      pass:
        mr_collection_share: 2500
      fail:
        mr_collection_share: 10000
- id: NWR-TLV-16
  reject_level: TR
  field: publisher_chain_control
  level: mandatory
  version: '2.0'
  description: A non-controlled publisher (OPU) cannot appear in a chain started with a controlled original publisher (SPU).
  note: >-
    The baseline has no OPU record to patch, and none of this tool's
    single-record-patch mechanisms can add one -- engine.py's
    _apply_nwr_tlv_16 instead clones the chain's controlled (E) SPU,
    relabels it OPU (OPU shares SPU's exact REAL_LAYOUT byte offsets),
    clears its Publisher Type and Ownership Shares (so it doesn't
    collaterally inflate NWR-TLV-04's total), and keeps the same Publisher
    Sequence # so it lands in the same chain.
  bmi_exception: ''
- id: NWR-TLV-17
  reject_level: TR
  field: publisher_chain_originals
  level: mandatory
  version: '2.0'
  description: There can only be one original publisher (Publisher Type E) in a publisher chain.
  note: >-
    Checked in validator.py by counting Publisher Type E records per
    Publisher Sequence #; generated by retyping the first chain's
    Administrator (AM) SPU to E as well, giving that chain two.
  bmi_exception: ''
  targets:
    - record_type: SPU
      match:
        publisher_type: AM
      pass:
        publisher_type: AM
      fail:
        publisher_type: E
- id: NWR-TLV-20
  reject_level: TR
  field: swr_collection
  level: mandatory
  version: '2.0'
  description: For each writer controlled by the submitter that has collection shares, there must be at least one SWT record.
  note: >-
    Checked in validator.py by comparing SWR vs. SWT Interested Party #s.
    The baseline has only one SWR/SWT pair, so unlike NWR-TLV-07 there's no
    second writer's SWT to redirect onto -- FAIL mismatches the SWT's IP
    outright, which also collaterally trips the pre-existing "SWT must
    match a known SWR" check. A fully clean FAIL would need a second
    SWR/OWR record, which this tool can't synthesize yet.
  bmi_exception: ''
  targets:
    - record_type: SWT
      pass:
        interested_party_n: AUTO_SWR_IP
      fail:
        interested_party_n: '999999999'
- id: NWR-TLV-22
  reject_level: GR
  field: grh_type_match
  level: mandatory
  version: '2.0'
  description: The Transaction Record Type (NWR or REV) must be the same as the Transaction Type of the immediately preceding GRH record.
  note: >-
    Previously left deliberately unchecked on a concern it would fire
    against every generated file (this app's GRH defaults to NWR, matching
    every synthetic NWR record); in practice, the only other rule that ever
    patches GRH's Transaction Type away from NWR is GRH-FLV-01's own FAIL
    case, where this now firing alongside it is a correct consequence, not
    a false positive -- confirmed by a full regression run. Generated here
    by mismatching GRH's Transaction Type against the actual NWR header.
  bmi_exception: ''
  targets:
    - record_type: GRH
      pass:
        transaction_type: NWR
      fail:
        transaction_type: REV
- id: NWR-TLV-23
  reject_level: TR
  field: version_type
  level: mandatory
  version: '2.1'
  description: If Version Type is ORI, there cannot be an SWR or OWR record with a Writer Designation Code of AR/AD/SR/SA/TR.
  note: >-
    Checked by validator.py as a cross-record check across all SWR/OWR
    children (finding attributed to NWR's version_type field); Version Type
    is left at the baseline's default ORI (no patch needed) and only the
    one SWR's Writer Designation Code is toggled.
  bmi_exception: ''
  targets:
    - record_type: SWR
      pass:
        writer_designation_code: CA
      fail:
        writer_designation_code: AR
- id: NWR-TLV-24
  reject_level: TR
  field: null
  level: mandatory
  version: '2.1'
  description: If all writers (SWR/OWR) are in the public domain, the total ownership shares for performing rights must equal zero.
  implemented: false
  reason: This tool doesn't track a "public domain" writer flag.
  bmi_exception: ''
- id: NWR-TLV-25
  reject_level: TR
  field: publisher_chain_share
  level: mandatory
  version: '2.1'
  description: For each SPU publisher chain (excluding OPUs), the sum of PR/MR/SR Ownership Share for SPU records with type E or AQ must be greater than zero.
  note: >-
    Checked in validator.py by summing PR/MR/SR Ownership Share across a
    chain's E/AQ records; generated by zeroing the first chain's Original
    Publisher (E) shares -- that chain has no AQ, so its E record is the
    only contributor.
  bmi_exception: ''
  targets:
    - record_type: SPU
      pass:
        pr_ownership_share: 2500
        mr_ownership_share: 2500
        sr_ownership_share: 0
      fail:
        pr_ownership_share: 0
        mr_ownership_share: 0
        sr_ownership_share: 0
- id: NWR-TLV-26
  reject_level: TR
  field: publisher_chain_acquirer
  level: mandatory
  version: '2.1'
  description: If an SPU record with type AQ appears in a chain of title, the Ownership shares on the preceding Original publisher must be zero.
  note: >-
    The baseline has no AQ-type SPU -- generated by retyping the first
    chain's Administrator (AM) SPU to AQ with a nonzero share (satisfying
    AQ's own pre-existing "must not be all zero" check) while leaving the
    chain's Original Publisher (E) at its baseline nonzero share for FAIL,
    or zeroing it for PASS (which stays compatible with NWR-TLV-25, since
    that check sums E *and* AQ shares together).
  bmi_exception: ''
  targets:
    - record_type: SPU
      match:
        publisher_type: AM
      pass:
        publisher_type: AQ
        pr_ownership_share: 2500
        mr_ownership_share: 2500
      fail:
        publisher_type: AQ
        pr_ownership_share: 2500
        mr_ownership_share: 2500
    - record_type: SPU
      match:
        publisher_type: E
      pass:
        pr_ownership_share: 0
        mr_ownership_share: 0
        sr_ownership_share: 0
      fail:
        pr_ownership_share: 2500
        mr_ownership_share: 2500
        sr_ownership_share: 0
- id: NWR-TLV-27
  reject_level: TR
  field: spt_collection_match
  level: mandatory
  version: '2.1'
  description: >-
    For performing rights, within each chain of title, the sum of
    Collection Shares for any group of SPT records within a territory must
    equal the total Ownership shares on the preceding Original Publisher
    and Acquirer SPU records (tolerance .06%), under specified conditions.
  note: >-
    SPT records are attributed to a chain by file position (the chain they
    physically follow), not by Interested Party #, since an administrator's
    IP can legitimately repeat across chains; generated by mismatching the
    first chain's World-territory (Administrator) SPT's PR Collection Share
    against the chain's Original Publisher Ownership Share.
  bmi_exception: ''
  targets:
    - record_type: SPT
      match:
        inclusion_exclusion_indicator: I
      pass:
        pr_collection_share: 2500
      fail:
        pr_collection_share: 4000
- id: NWR-TLV-43
  reject_level: TR
  field: record_order
  level: mandatory
  version: '2.2'
  description: >-
    The sequence of records within the transaction must follow the exact
    canonical order (NWR/REV/ISW/EXC, SPU, NPN, SPT, OPT, OPU, NPN, OPT,
    SWR, NWN, SWT, PWR, OWR, NWN, PWR, OWT, ALT, NAT, EWT, NET, NOW, VER,
    NVT, NOW, PER, NPR, REC, ORN, INS, IND, COM, NCT, NOW, ARI, XRF).
  note: >-
    Enforced in validator.py only at the coarser "phase" level this tool
    can actually model (see _TLV43_PHASE) -- publisher records, then writer
    records, then PWR, then ALT/PER/REC/ORN/INS-IND/COM/XRF -- since several
    of the listed record types (NPN, NAT, EWT, NET, NOW, VER, NVT, NPR,
    NCT, ARI) aren't modeled by this tool at all. Generated by swapping the
    file positions of the first SWT and first PWR (bytes untouched).
  bmi_exception: ''
