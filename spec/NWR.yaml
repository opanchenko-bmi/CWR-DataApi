- id: NWR-TLV-45
  reject_level: TR
  field: text_music_relationship
  level: mandatory
  version: '2.0'
  description: If Text Music Relationship is MUS (music only), there should be no CA/A/SA/TR role codes among SWR/OWR writers (only C or AR).
  note: >-
    Checked by validator.py as a cross-record check across all SWR/OWR
    children; generated by setting Text Music Relationship to MUS on NWR
    and toggling the baseline's one SWR between C (PASS -- also satisfies
    NWR-TLV-12's CA/A/C requirement) and CA (FAIL).
  bmi_exception: ''
  targets:
    - record_type: NWR
      pass:
        text_music_relationship: MUS
      fail:
        text_music_relationship: MUS
    - record_type: SWR
      pass:
        writer_designation_code: C
      fail:
        writer_designation_code: CA
