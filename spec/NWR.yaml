record_type: NWR
name: New Work Registration
rules:
- id: NWR-FLV-01
  reject_level: TR
  field: work_title
  level: mandatory
  version: '2.0'
  description: Work Title must be present.
  bmi_exception: ''
  pass:
    work_title: MIDNIGHT DRIVE
  fail:
    work_title: ''
- id: NWR-FLV-02
  reject_level: TR
  field: language_code
  level: optional
  version: '2.0'
  description: Language Code, if entered, must match an entry in the Language Code table.
  bmi_exception: ''
  pass:
    language_code: EN
  fail:
    language_code: ZZ
- id: NWR-FLV-03
  reject_level: TR
  field: submitter_work_n
  level: mandatory
  version: '2.0'
  description: Submitter Work Number must be present and unique.
  bmi_exception: ''
  pass:
    submitter_work_n: W0000000123
  fail:
    submitter_work_n: ''
- id: NWR-FLV-04
  reject_level: FR
  field: iswc
  level: optional
  version: '2.0'
  description: ISWC when present must match T-DDDDDDDDD-C format.
  bmi_exception: ''
  pass:
    iswc: T1234567894
  fail:
    iswc: XX99
- id: NWR-FLV-05
  reject_level: FR
  field: copyright_date
  level: optional
  version: '2.0'
  description: Copyright Date must be a valid date.
  bmi_exception: ''
  pass:
    copyright_date: '20200101'
  fail:
    copyright_date: '99999999'
- id: NWR-FLV-06
  reject_level: TR
  field: musical_work_distribution_category
  level: mandatory
  version: '2.0'
  description: Musical Work Distribution Category must be entered and match an entry in the table (e.g.
    POP, SER, JAZ).
  bmi_exception: ''
  pass:
    musical_work_distribution_category: POP
  fail:
    musical_work_distribution_category: ZZZ
- id: NWR-FLV-07
  reject_level: TR
  field: duration
  level: conditional
  version: '2.0'
  description: If Musical Work Distribution Category is SER, Duration must be greater than zero.
  bmi_exception: ''
  pass:
    musical_work_distribution_category: SER
    duration: '015000'
  fail:
    musical_work_distribution_category: SER
    duration: '000000'
- id: NWR-FLV-09
  reject_level: FR
  field: recorded_indicator
  level: mandatory
  version: '2.0'
  description: Recorded Indicator must be equal to Y, N, or U.
  bmi_exception: ''
  pass:
    recorded_indicator: Y
  fail:
    recorded_indicator: Z
- id: NWR-FLV-12
  reject_level: TR
  field: version_type
  level: mandatory
  version: '2.0'
  description: Version Type must be a valid code (ORI/MOD).
  bmi_exception: ''
  pass:
    version_type: ORI
  fail:
    version_type: ZZZ
- id: NWR-FLV-14
  reject_level: TR
  field: music_arrangement
  level: conditional
  version: '2.0'
  description: If Version Type is MOD, Music Arrangement must be entered.
  bmi_exception: ''
  pass:
    version_type: MOD
    music_arrangement: ARR
  fail:
    version_type: MOD
    music_arrangement: ''
- id: NWR-FLV-15
  reject_level: TR
  field: lyric_adaptation
  level: conditional
  version: '2.0'
  description: If Version Type is MOD, Lyric Adaptation must be entered.
  bmi_exception: ''
  pass:
    version_type: MOD
    lyric_adaptation: NEW
  fail:
    version_type: MOD
    lyric_adaptation: ''
- id: NWR-FLV-16
  reject_level: FR
  field: grand_rights_ind
  level: conditional
  version: '2.0'
  description: Grand Rights Ind, if entered, must be equal to Y or N.
  bmi_exception: ''
  pass:
    grand_rights_ind: Y
  fail:
    grand_rights_ind: Z
- id: NWR-FLV-18
  reject_level: TR
  field: composite_component_count
  level: conditional
  version: '2.0'
  description: If Composite Type is entered, Composite Component Count must be entered.
  bmi_exception: ''
  pass:
    composite_type: MED
    composite_component_count: 3
  fail:
    composite_type: MED
    composite_component_count: 0
- id: NWR-FLV-19
  reject_level: TR
  field: composite_type
  level: conditional
  version: '2.0'
  description: If Composite Component Count is entered, Composite Type must be entered.
  bmi_exception: ''
  pass:
    composite_component_count: 3
    composite_type: MED
  fail:
    composite_component_count: 3
    composite_type: ''
- id: NWR-FLV-20
  reject_level: TR
  field: composite_component_count
  level: conditional
  version: '2.0'
  description: If entered, Composite Component Count must be numeric and greater than 1.
  bmi_exception: ''
  pass:
    composite_type: MED
    composite_component_count: 3
  fail:
    composite_type: MED
    composite_component_count: 1
- id: NWR-FLV-24
  reject_level: TR
  field: work_title
  level: mandatory
  version: '2.0'
  description: Work Title must contain only valid ASCII characters.
  bmi_exception: ''
  pass:
    work_title: MIDNIGHT DRIVE
  fail:
    work_title: MIDNIGHT DRÍVE
- id: NWR-FLV-08
  reject_level: FR
  field: duration
  level: optional
  version: '2.0'
  description: If Musical Work Distribution Category is not SER and Duration is entered, it must be a
    valid combination of hours, minutes, and seconds.
  bmi_exception: ''
  pass:
    musical_work_distribution_category: POP
    duration: '015000'
  fail:
    musical_work_distribution_category: POP
    duration: '019900'
- id: NWR-FLV-10
  reject_level: FR
  field: text_music_relationship
  level: optional
  version: '2.0'
  description: Text Music Relationship, if entered, must match an entry in the Text Music Relationship
    table.
  bmi_exception: ''
  pass:
    text_music_relationship: MTX
  fail:
    text_music_relationship: ZZZ
- id: NWR-FLV-11
  reject_level: FR
  field: composite_type
  level: optional
  version: '2.0'
  description: Composite Type, if entered, must match an entry in the Composite Type table.
  bmi_exception: ''
  pass:
    composite_type: MED
  fail:
    composite_type: ZZZ
- id: NWR-FLV-13
  reject_level: FR
  field: excerpt_type
  level: optional
  version: '2.0'
  description: Excerpt Type, if entered, must match an entry in the Excerpt Type table.
  bmi_exception: ''
  pass:
    excerpt_type: MOV
  fail:
    excerpt_type: ZZZ
- id: NWR-FLV-14B
  reject_level: TR
  field: music_arrangement
  level: conditional
  version: '2.0'
  description: If Version Type is MOD, Music Arrangement must match an entry in the Music Arrangement
    table.
  bmi_exception: ''
  pass:
    version_type: MOD
    music_arrangement: ARR
    lyric_adaptation: NEW
  fail:
    version_type: MOD
    music_arrangement: ZZZ
    lyric_adaptation: NEW
- id: NWR-FLV-15B
  reject_level: TR
  field: lyric_adaptation
  level: conditional
  version: '2.0'
  description: If Version Type is MOD, Lyric Adaptation must match an entry in the Lyric Adaptation table.
  bmi_exception: ''
  pass:
    version_type: MOD
    music_arrangement: ARR
    lyric_adaptation: NEW
  fail:
    version_type: MOD
    music_arrangement: ARR
    lyric_adaptation: ZZZ
- id: NWR-FLV-17
  reject_level: FR
  field: cwr_work_type
  level: optional
  version: '2.0'
  description: CWR Work Type, if entered, must match an entry in the CWR Work Type table.
  bmi_exception: ''
  pass:
    cwr_work_type: TA
  fail:
    cwr_work_type: ZZ
- id: NWR-FLV-BMI-01
  reject_level: TR
  field: duration
  level: conditional
  version: '2.0'
  description: 'For registrations to BMI only: if Musical Work Distribution Category is JAZ and BMI is represented on the work, Duration must be greater than zero.'
  note: >-
    This tool has no per-record "society represented" model, so "BMI
    represented" is approximated in validator.py as any SPU/OPU/SWR/OWR
    record carrying BMI's Society Code (021) as its PR or MR Affiliation
    Society; generated by patching the first SPU's PR Affiliation Society
    to 021 alongside Musical Work Distribution Category/Duration on NWR.
  bmi_exception: ''
  targets:
    - record_type: NWR
      pass:
        musical_work_distribution_category: JAZ
        duration: '015000'
      fail:
        musical_work_distribution_category: JAZ
        duration: '000000'
    - record_type: SPU
      pass:
        pr_affiliation_society: '021'
      fail:
        pr_affiliation_society: '021'
# - id: NWR-FLV-GEMA-01
#   reject_level: FR
#   field: iswc
#   level: conditional
#   version: '2.0'
#   description: 'For registrations to GEMA only: if an ISWC is entered and is part of the GEMA number block, that number must already be registered by GEMA.'
#   implemented: false
#   reason: Society-specific (GEMA only); no ISWC-block registration database is modeled.
#   bmi_exception: ''
