# CWR 2.2 record layout: OWT - Other Writer Collection
# OWT shares SWT's record format (CWR11-1991R3, section 5.12-5.13). Fields
# duplicated here from SWT.yaml for a self-contained per-type file; keep in
# sync with SWT.yaml if the layout changes.
#
# Corrected name -- the original stub guessed "Other Writer Territory of
# Control"; the real spec section title is "Other Writer Collection".
record_type: OWT
name: Other Writer Collection
# OWT is a whole new record type introduced in CWR 2.2 (not merely a field
# addition to an existing record) -- per the CWR 2.2 revision changelog:
# "OWT new 'other writer collection' record (optional)". It does not exist
# at all in real CWR 2.0/2.1 files.
since_version: '2.2'
rules:
- id: OWT-FLV-01
  reject_level: TR
  field: interested_party_n
  level: conditional
  version: '2.2'
  description: 'Interested Party #, if entered, must match a preceding SWR/OWR record.'
  bmi_exception: ''
  pass:
    interested_party_n: AUTO_SWR_IP
  fail:
    interested_party_n: '999999999'
- id: OWT-FLV-02
  reject_level: TR
  field: pr_collection_share
  level: optional
  version: '2.2'
  description: PR Collection Share must be within 0 - 100.00% (0-10000).
  bmi_exception: ''
  pass:
    pr_collection_share: 5000
  fail:
    pr_collection_share: 13000
- id: OWT-FLV-03
  reject_level: TR
  field: tis_numeric_code
  level: mandatory
  version: '2.2'
  description: TIS Numeric Code must be a valid CISAC territory.
  bmi_exception: 'BMI: code 0 and 99 (unknown) are standardized to NULL downstream.'
  pass:
    tis_numeric_code: 2136
  fail:
    tis_numeric_code: 9998
- id: OWT-FLV-04
  reject_level: TR
  field: inclusion_exclusion_indicator
  level: mandatory
  version: '2.2'
  description: Inclusion/Exclusion Indicator must be I or E.
  bmi_exception: ''
  pass:
    inclusion_exclusion_indicator: I
  fail:
    inclusion_exclusion_indicator: X
- id: OWT-FLV-05
  reject_level: TR
  field: null
  level: mandatory
  version: '2.2'
  description: An OWT record must follow an OWR, NWN, or another OWT record.
  implemented: false
  reason: Structural record-ordering check; not exercisable via a single-field patch.
  bmi_exception: ''
- id: OWT-FLV-06
  reject_level: TR
  field: null
  level: mandatory
  version: '2.2'
  description: An OWT record must not follow an SWR in a controlled chain.
  implemented: false
  reason: Structural record-ordering check across the writer chain; not exercisable via a single-field patch.
  bmi_exception: ''
fields:
  - key: record_type
    name: Record Type
    start: 1
    length: 3
    type: A
    req: mandatory
    valid_values: ["OWT"]
    description: OWT = Other Writer Collection.
  - key: transaction_sequence
    name: Transaction Sequence
    start: 4
    length: 8
    type: N
    req: mandatory
    description: Must equal the Transaction Sequence # of the transaction header this record belongs to.
  - key: record_sequence
    name: Record Sequence
    start: 12
    length: 8
    type: N
    req: mandatory
    description: Previous record's Record Sequence # + 1.
  - key: interested_party
    name: Interested Party
    start: 20
    length: 9
    type: A
    req: conditional
    description: Submitting publisher's unique identifier for this writer (can be blank, matching a preceding OWR).
  - key: pr_collection_share
    name: PR Collection Share
    start: 29
    length: 5
    type: N
    req: optional
    description: '% of total royalty for performance collected by this writer within the territory. Range 0-10000.'
  - key: mr_collection_share
    name: MR Collection Share
    start: 34
    length: 5
    type: N
    req: optional
    description: '% of total royalty for mechanical uses collected by this writer. Range 0-10000.'
  - key: sr_collection_share
    name: SR Collection Share
    start: 39
    length: 5
    type: N
    req: optional
    description: '% of total royalty for synch rights collected by this writer. Range 0-10000.'
  - key: inclusion_exclusion_indicator
    name: Inclusion Exclusion Indicator
    start: 44
    length: 1
    type: L
    req: mandatory
    valid_values_ref: VALID_INCL_EXCL
    description: Whether the territory in this record is included (I) or excluded (E).
  - key: tis_numeric_code
    name: TIS Numeric Code
    start: 45
    length: 4
    type: L
    req: mandatory
    valid_values_ref: VALID_TIS
    description: A territory within which this writer has collection rights.
  - key: shares_change
    name: Shares change
    start: 49
    length: 1
    type: B
    req: optional
    valid_values_ref: VALID_YN
    description: Y if the shares change on sub-publication in this territory.
  - key: sequence
    name: Sequence
    start: 50
    length: 3
    type: N
    req: mandatory
    description: Sequential number assigned to each territory following an SWR/OWR, starting at 1. Added CWR 2.1.
record_length: 52
