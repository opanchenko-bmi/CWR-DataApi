# CWR 2.2 record layout: ACK - Acknowledgement of Transaction
# Fields transcribed from the official CISAC CWR 2.2 functional spec
# (CWR11-1991R3, section 4.1 "ACK").
#
# Like TER/IPA, ACK won't appear in most real files, including this
# project's own valid_baseline.V22 -- Generate PASS/FAIL for any implemented
# rule below requires loading (dragging/browsing) a real file that already
# carries an ACK record (a society's response file, not a submission).
record_type: ACK
name: Acknowledgement of Transaction
rules:
- id: ACK-TLV-01
  reject_level: TR
  field: record_type
  level: mandatory
  version: '2.0'
  description: Only one ACK is allowed per transaction.
  implemented: false
  reason: Structural check across the transaction; not exercisable via a single-field patch.
  bmi_exception: ''
- id: ACK-TLV-02
  reject_level: TR
  field: record_type
  level: mandatory
  version: '2.0'
  description: The ACK transaction must be followed by one of NWR, REV, or AGR transactions.
  implemented: false
  reason: >-
    Structural ordering check ("must immediately follow X"); left
    unimplemented for the same reason as this catalog's other such rules
    (TER-RLV-01, OPT-FLV-05, NWN-RLV-01, ...).
  bmi_exception: ''
- id: ACK-TLV-03
  reject_level: TR
  field: record_type
  level: mandatory
  version: '2.0'
  description: The EXC transaction must follow an NWR or REV transaction within the ACK transaction.
  implemented: false
  reason: Structural ordering check across the whole ACK transaction; not exercisable via a single-field patch.
  bmi_exception: ''
- id: ACK-TLV-04
  reject_level: GR
  field: record_type
  level: mandatory
  version: '2.0'
  description: The Transaction Type of the immediately preceding GRH must be ACK for submissions from a society.
  implemented: false
  reason: Structural ordering check across the file's GRH; not exercisable via a single-field patch.
  bmi_exception: ''
- id: ACK-FLV-01
  reject_level: TR
  field: creation_date
  level: mandatory
  version: '2.0'
  description: The combination of Creation Date and Creation Time must match the same fields on the HDR record of the file generated by the submitter.
  implemented: false
  reason: Cross-file check against the submitter's original file, which this single-file tool doesn't have.
  bmi_exception: ''
- id: ACK-FLV-02
  reject_level: TR
  field: original_group_id
  level: mandatory
  version: '2.0'
  description: The combination of Original Group Number and Transaction Sequence # must be valid within the referenced file.
  implemented: false
  reason: Cross-file check against the submitter's original file, which this single-file tool doesn't have.
  bmi_exception: ''
- id: ACK-FLV-03
  reject_level: TR
  field: original_transaction_type
  level: mandatory
  version: '2.0'
  description: Original Transaction Type must match the transaction referred to by Creation Date, Creation Time, Original Group #, and Original Transaction Sequence #.
  implemented: false
  reason: Cross-file check against the submitter's original file, which this single-file tool doesn't have.
  bmi_exception: ''
- id: ACK-FLV-04
  reject_level: TR
  field: creation_title
  level: conditional
  version: '2.0'
  description: Creation Title must match the corresponding title associated with the Submitter Creation #, and is required if the ACK is in response to an NWR or REV transaction.
  implemented: false
  reason: Cross-file check against the submitter's original file, which this single-file tool doesn't have.
  bmi_exception: ''
- id: ACK-FLV-05
  reject_level: TR
  field: submitter_creation_n
  level: conditional
  version: '2.0'
  description: Submitter Creation # must match an entry in the submitter's database.
  implemented: false
  reason: No cross-file submitter database is modeled in this project.
  bmi_exception: ''
- id: ACK-FLV-06
  reject_level: TR
  field: recipient_creation_n
  level: conditional
  version: '2.0'
  description: If entered, Recipient Creation # must match an entry in the recipient's database.
  implemented: false
  reason: No cross-file recipient database is modeled in this project.
  bmi_exception: ''
- id: ACK-FLV-07
  reject_level: TR
  field: processing_date
  level: mandatory
  version: '2.0'
  description: Processing Date must be a valid date.
  bmi_exception: ''
  pass:
    processing_date: TODAY
  fail:
    processing_date: '20239999'
- id: ACK-FLV-08
  reject_level: TR
  field: transaction_status
  level: mandatory
  version: '2.0'
  description: Transaction Status must match an entry in the Transaction Status table.
  bmi_exception: ''
  pass:
    transaction_status: AC
  fail:
    transaction_status: ZZ
fields:
  - key: record_type
    name: Record Type
    start: 1
    length: 3
    type: A
    req: mandatory
    valid_values: ["ACK"]
    description: ACK = Acknowledgement of Transaction.
  - key: transaction_sequence
    name: Transaction Sequence #
    start: 4
    length: 8
    type: N
    req: mandatory
    description: 00000000 for the first transaction in a group, else previous transaction header's value + 1.
  - key: record_sequence
    name: Record Sequence #
    start: 12
    length: 8
    type: N
    req: mandatory
    description: 00000000 for a transaction header record.
  - key: creation_date
    name: Creation Date
    start: 20
    length: 8
    type: D
    req: mandatory
    description: The Creation Date of the original file that contained the transaction this ACK applies to.
  - key: creation_time
    name: Creation Time
    start: 28
    length: 6
    type: T
    req: mandatory
    description: The Creation Time of the original file that contained the transaction this ACK applies to.
  - key: original_group_id
    name: Original Group ID
    start: 34
    length: 5
    type: N
    req: mandatory
    description: >-
      The Group ID of the original transaction this ACK applies to. Zeroes
      if the ACK is a result of an HDR/TRL record problem.
  - key: original_transaction_sequence
    name: Original Transaction Sequence #
    start: 39
    length: 8
    type: N
    req: mandatory
    description: >-
      The Transaction Sequence # of the original transaction this ACK
      applies to. Zeroes if the ACK is a result of an HDR/TRL record problem.
  - key: original_transaction_type
    name: Original Transaction Type
    start: 47
    length: 3
    type: L
    req: mandatory
    valid_values_ref: VALID_TXN_TYPE
    description: >-
      The Transaction Type of the original transaction this ACK applies to.
      HDR or TRL if the ACK is a result of an HDR/TRL record problem.
  - key: creation_title
    name: Creation Title
    start: 50
    length: 60
    type: A
    req: conditional
    description: The title as delivered by the submitter. Required if the ACK is in response to an NWR or REV.
  - key: submitter_creation_number
    name: Submitter Creation Number
    start: 110
    length: 20
    type: A
    req: conditional
    description: The unique identifier assigned by the original submitter to this work. Required if in response to a transaction.
  - key: recipient_creation_number
    name: Recipient Creation Number
    start: 130
    length: 20
    type: A
    req: conditional
    description: >-
      The unique identifier assigned by the recipient. Required if in
      response to a transaction and the transaction status indicates
      acceptance.
  - key: processing_date
    name: Processing Date
    start: 150
    length: 8
    type: D
    req: mandatory
    description: The date this transaction or file was formally processed by the recipient.
  - key: transaction_status
    name: Transaction Status
    start: 158
    length: 2
    type: L
    req: mandatory
    description: The current status of this transaction (Transaction Status Table).
record_length: 159
