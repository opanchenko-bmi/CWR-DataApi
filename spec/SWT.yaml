record_type: SWT
name: Writer Territory of Control
rules:
- id: SWT-FLV-02
  reject_level: TR
  field: interested_party_n
  level: mandatory
  version: '2.0'
  description: 'Interested Party # must be entered and must equal the Interested Party # on the previous
    SWR record.'
  bmi_exception: ''
  pass:
    interested_party_n: AUTO_SWR_IP
  fail:
    interested_party_n: '999999999'
- id: SWT-FLV-03
  reject_level: TR
  field: pr_collection_share
  level: optional
  version: '2.0'
  description: PR Collection Share must be within 0 - 100.00% (0-10000).
  bmi_exception: ''
  pass:
    pr_collection_share: 5000
  fail:
    pr_collection_share: 13000
- id: SWT-FLV-04
  reject_level: TR
  field: mr_collection_share
  level: optional
  version: '2.0'
  description: MR Collection Share must be within 0 - 100.00% (0-10000).
  bmi_exception: ''
  pass:
    mr_collection_share: 5000
  fail:
    mr_collection_share: 13000
- id: SWT-FLV-05
  reject_level: TR
  field: sr_collection_share
  level: optional
  version: '2.0'
  description: SR Collection Share must be within 0 - 100.00% (0-10000).
  bmi_exception: ''
  pass:
    sr_collection_share: 5000
  fail:
    sr_collection_share: 13000
- id: SWT-FLV-06
  reject_level: TR
  field: tis_numeric_code
  level: mandatory
  version: '2.0'
  description: TIS Numeric Code must be a valid CISAC territory.
  bmi_exception: 'BMI: code 0 and 99 (unknown) are standardized to NULL downstream.'
  pass:
    tis_numeric_code: 2136
  fail:
    tis_numeric_code: 9998
- id: SWT-FLV-07
  reject_level: TR
  field: inclusion_exclusion_indicator
  level: mandatory
  version: '2.0'
  description: Inclusion/Exclusion Indicator must be I or E.
  bmi_exception: ''
  pass:
    inclusion_exclusion_indicator: I
  fail:
    inclusion_exclusion_indicator: X
- id: SWT-FLV-08
  reject_level: FR
  field: shares_change
  level: optional
  version: '2.0'
  description: Shares change, if entered, must be Y or N.
  bmi_exception: ''
  pass:
    shares_change: Y
  fail:
    shares_change: Z
- id: SWT-FLV-09
  reject_level: RR
  field: sequence_n
  level: mandatory
  version: '2.1'
  description: 'Sequence # must be present and numeric, starting at 1 for the first SWT after an SWR.'
  bmi_exception: ''
  pass:
    sequence_n: 1
  fail:
    sequence_n: 0
- id: SWT-RLV-01
  reject_level: TR
  field: pr_collection_share
  level: mandatory
  version: '2.0'
  description: If the Inclusion/Exclusion Indicator is I, at least one of PR/MR/SR Collection Share must
    be greater than zero.
  bmi_exception: ''
  pass:
    inclusion_exclusion_indicator: I
    pr_collection_share: 5000
  fail:
    inclusion_exclusion_indicator: I
    pr_collection_share: 0
    mr_collection_share: 0
    sr_collection_share: 0
- id: SWT-FLV-01
  reject_level: TR
  field: record_type
  level: mandatory
  version: '2.0'
  description: An SWT record must follow an SWR, NWN, or another SWT record.
  note: >-
    Already checked generically (validator.py's SPT/OPT/SWT/OWT predecessor
    loop); generated by swapping the NWR header and the SWT's file
    positions (engine.py's _apply_swt_flv_01) so it lands right after GRH.
    Unlike SPT-FLV-01's identical trick, this unavoidably also trips
    NWR-TLV-43's canonical order (SWT is phase 2, so moving it ahead of the
    phase-1 SPU/SPT block always dips the phase sequence, regardless of
    which record it's swapped with).
  bmi_exception: ''
- id: SWT-RLV-02
  reject_level: TR
  field: territory_link
  level: mandatory
  version: '2.0'
  description: Each territory (TIS code) included on an SWT record can only be linked to one SWR for a given right.
  note: >-
    Scoped globally (file-wide), not per chain like SPT-RLV-02 -- writers
    have no chain/administrator-hierarchy concept. Generated by
    engine.py's _apply_swt_rlv_02, which clones a second, fully independent
    writer (SWR with zero ownership shares, so NWR-TLV-04's aggregate is
    unaffected; SWT claiming the *same* territory/right as the original --
    the actual violation; and a PWR linking it to the first chain's
    publisher, so it doesn't collaterally trip SWR-RLV-02's own "every
    controlled writer needs a PWR" check). The first genuinely independent
    second-writer synthesis in this tool, as opposed to NWR-TLV-10/
    SWR-FLV-20-MOD's PASS, which just avoid triggering their own
    precondition.
  bmi_exception: ''
- id: SWT-RLV-03
  reject_level: FR
  field: pr_collection_share
  level: mandatory
  version: '2.0'
  description: If the Inclusion/Exclusion Indicator is E, all Collection Shares must be set to zero.
  note: >-
    A same-record conditional check (not actually cross-record), added
    alongside the existing SWT-RLV-01 range checks; generated by setting
    the baseline's one SWT to Excluded with a nonzero PR Collection Share
    for FAIL, zero for PASS.
  bmi_exception: ''
  targets:
    - record_type: SWT
      pass:
        inclusion_exclusion_indicator: E
        pr_collection_share: 0
        mr_collection_share: 0
        sr_collection_share: 0
      fail:
        inclusion_exclusion_indicator: E
        pr_collection_share: 5000
# - id: SWT-RLV-ASCAP-01
#   reject_level: TR
#   field: inclusion_exclusion_indicator
#   level: mandatory
#   version: '2.0'
#   description: 'For registrations to ASCAP only: the first SWT record immediately following an SWR must have the Inclusion/Exclusion Indicator set to I.'
#   implemented: false
#   reason: Society-specific (ASCAP only); this tool doesn't model per-record society interest.
#   bmi_exception: ''
# Field layout below is transcribed from the official CISAC CWR 2.2 spec
# (CWR11-1991R3, section 5.12-5.13 -- SWT/OWT share one record format).
# start/length are 1-based, spec-defined. Record Prefix (1-19) as in NWR.
fields:
  - name: Record Type
    start: 1
    length: 3
    type: A
    req: mandatory
    valid_values: ["SWT", "OWT"]
    description: SWT (Writer Territory of Control) or OWT (Other Writer Collection).
  - name: Transaction Sequence #
    start: 4
    length: 8
    type: N
    req: mandatory
    description: Must equal the Transaction Sequence # of the transaction header this record belongs to.
  - name: Record Sequence #
    start: 12
    length: 8
    type: N
    req: mandatory
    description: Previous record's Record Sequence # + 1.
  - name: Interested Party #
    start: 20
    length: 9
    type: A
    req: conditional
    description: Submitting publisher's unique identifier for this writer; must match the preceding SWR/OWR.
  - name: PR Collection Share
    start: 29
    length: 5
    type: N
    req: optional
    description: '% of total royalty for performance collected by this writer within the territory. Range 0-10000.'
  - name: MR Collection Share
    start: 34
    length: 5
    type: N
    req: optional
    description: '% of total royalty for mechanical uses collected by this writer. Range 0-10000.'
  - name: SR Collection Share
    start: 39
    length: 5
    type: N
    req: optional
    description: '% of total royalty for synch rights collected by this writer. Range 0-10000.'
  - name: Inclusion/Exclusion Indicator
    start: 44
    length: 1
    type: L
    req: mandatory
    valid_values_ref: VALID_INCL_EXCL
    description: Whether the territory in this record is included (I) or excluded (E).
  - name: TIS Numeric Code
    start: 45
    length: 4
    type: L
    req: mandatory
    valid_values_ref: VALID_TIS
    description: A territory within which this writer has collection rights.
  - name: Shares change
    start: 49
    length: 1
    type: B
    req: optional
    valid_values_ref: VALID_YN
    description: Y if the shares change on sub-publication in this territory.
  - name: Sequence #
    start: 50
    length: 3
    type: N
    req: mandatory
    since: '2.1'
    description: Sequential number assigned to each territory following an SWR/OWR, starting at 1. Added CWR 2.1.
record_length: 52
