# CWR 2.2 record layout: NPR - Performance Data in non-roman alphabet
# Fields transcribed from the official CISAC CWR 2.2 functional spec
# (CWR11-1991R3, section 5.20). No rules defined for this type yet.
record_type: NPR
name: Performance Data in Non-Roman Alphabet
# Like EWT/VER/REC/PER/COM, NPR won't appear in most real files, including
# this project's own valid_baseline.V22 -- Generate PASS/FAIL for any rule
# below requires loading (dragging/browsing) a real file that already
# carries an NPR record.
rules:
- id: NPR-FLV-01
  reject_level: FR
  field: performing_artist_ipi_name_n
  level: optional
  version: '2.0'
  description: If Performing Artist IPI Name # is entered, it must match an entry on the IPI database.
  implemented: false
  reason: No IPI database is modeled in this project's lookups.
  bmi_exception: ''
- id: NPR-FLV-02
  reject_level: FR
  field: performing_artist_ipi_base_number
  level: optional
  version: '2.0'
  description: If Performing Artist IPI Base Number is entered, it must match an entry in the IPI database.
  implemented: false
  reason: No IPI database is modeled in this project's lookups.
  bmi_exception: ''
- id: NPR-FLV-03
  reject_level: FR
  field: language_code
  level: optional
  version: '2.0'
  description: Language code, if entered, must be a valid code from the Language Code Table.
  bmi_exception: ''
  pass:
    language_code: EN
  fail:
    language_code: ZZ
- id: NPR-RLV-01
  reject_level: RR
  field: record_type
  level: mandatory
  version: '2.1'
  description: One of Performing Artist Name, Performance Language, or Performance Dialect must be entered.
  bmi_exception: ''
  pass:
    performing_artist_name: SWV
  fail:
    performing_artist_name: ''
    performance_language: ''
    performance_dialect: ''
- id: NPR-FLV-04
  reject_level: FR
  field: performance_language
  level: conditional
  version: '2.1'
  description: Performance Language, if entered, must be a valid code from the Language Code Table.
  bmi_exception: ''
  pass:
    performance_language: EN
  fail:
    performance_language: ZZ
- id: NPR-FLV-05
  reject_level: FR
  field: performance_dialect
  level: conditional
  version: '2.1'
  description: Performance Dialect, if entered, must be a valid code from ISO 639-2(T).
  implemented: false
  reason: No ISO 639-2(T) dialect table is modeled in this project's lookups (VALID_LANGUAGE is the 2-letter CWR language table, a different code set).
  bmi_exception: ''
fields:
  - name: Record Type
    start: 1
    length: 3
    type: A
    req: mandatory
    valid_values: ["NPR"]
    description: NPR = Performance Data in non-roman alphabet.
  - name: Transaction Sequence #
    start: 4
    length: 8
    type: N
    req: mandatory
    description: Must equal the Transaction Sequence # of the transaction header this record belongs to.
  - name: Record Sequence #
    start: 12
    length: 8
    type: N
    req: mandatory
    description: Previous record's Record Sequence # + 1.
  - name: Performing Artist Name
    start: 20
    length: 160
    type: A
    req: conditional
    description: Name of a person or group that performed the work, in non-Roman alphabet.
  - name: Performing Artist First Name
    start: 180
    length: 160
    type: A
    req: optional
    description: First name of a person that performed the work, in non-Roman alphabet.
  - name: Performing Artist IPI Name #
    start: 340
    length: 11
    type: L
    req: optional
    description: The IPI Name # corresponding to this performing artist.
  - name: Performing Artist IPI Base Number
    start: 351
    length: 13
    type: L
    req: optional
    description: The IPI base number assigned to this performing artist.
  - name: Language Code
    start: 364
    length: 2
    type: L
    req: optional
    valid_values_ref: VALID_LANGUAGE
    description: The language code of the name.
  - name: Performance Language
    start: 366
    length: 2
    type: L
    req: conditional
    since: '2.1'
    valid_values_ref: VALID_LANGUAGE
    description: The language used in the performance. Added CWR 2.1.
  - name: Performance Dialect
    start: 368
    length: 3
    type: L
    req: conditional
    since: '2.1'
    description: >-
      The dialect used in the performance, per ISO 639-2(T) (e.g. CHN
      Mandarin, YUH Cantonese, CFR Min Nan, HAK Hakka). Added CWR 2.1. One
      of Performing Artist Name, Performance Language, or Performance
      Dialect must be entered.
record_length: 370
